# Keeps the upstream-main branch identical to maziggy/bambuddy:main and opens
# a PR upstream-main -> main whenever there are new upstream commits.
#
# Requires the UPSTREAM_SYNC_TOKEN secret: a fine-grained PAT scoped to this
# repo with Contents, Pull requests and Workflows (read/write). GITHUB_TOKEN is
# not enough because upstream commits touch .github/workflows/ and PRs opened
# by GITHUB_TOKEN don't trigger CI.
name: Sync upstream

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 09:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: maziggy/bambuddy
  UPSTREAM_BRANCH: main
  MIRROR_BRANCH: upstream-main
  TARGET_BRANCH: main

jobs:
  sync:
    if: github.repository != 'maziggy/bambuddy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Fast-forward mirror branch
        id: mirror
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --tags
          git fetch origin "${MIRROR_BRANCH}"

          before=$(git rev-parse "origin/${MIRROR_BRANCH}")
          after=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")

          if [ "$before" = "$after" ]; then
            echo "Mirror already up to date."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$before" "$after"; then
            echo "::error::${MIRROR_BRANCH} has diverged from upstream. It must never receive local commits."
            exit 1
          fi

          git push origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"
          git push origin --tags
          echo "Mirror moved ${before:0:7} -> ${after:0:7}"

      - name: Open PR into main
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          git fetch origin "${MIRROR_BRANCH}" "${TARGET_BRANCH}"
          ahead=$(git rev-list --count "origin/${TARGET_BRANCH}..origin/${MIRROR_BRANCH}")
          if [ "$ahead" -eq 0 ]; then
            echo "main already contains all upstream commits."
            exit 0
          fi

          existing=$(gh pr list --head "${MIRROR_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #${existing} already open; it now includes the new commits."
            exit 0
          fi

          gh pr create \
            --head "${MIRROR_BRANCH}" \
            --base "${TARGET_BRANCH}" \
            --title "Sync upstream ${UPSTREAM_REPO}@$(git rev-parse --short origin/${MIRROR_BRANCH})" \
            --body "Automated sync of ${ahead} commit(s) from [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}).

          Merge with a **merge commit** (not squash/rebase) so git keeps track of what was already integrated."
